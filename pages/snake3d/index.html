<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake 3D — Cocobot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game-canvas{display:block;width:100%;height:100%}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;pointer-events:none}
#score-box{background:rgba(10,10,18,.75);backdrop-filter:blur(8px);border:1px solid rgba(0,212,255,.2);border-radius:12px;padding:8px 18px;color:#00d4ff;font-size:1.1em;font-weight:700;letter-spacing:.5px}
#highscore-box{background:rgba(10,10,18,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,170,0,.2);border-radius:12px;padding:8px 18px;color:#ffaa00;font-size:.95em;font-weight:600}

/* Touch zones */
#touch-zones{position:fixed;bottom:0;left:0;right:0;height:40%;z-index:5;display:flex}
.touch-zone{flex:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.touch-zone:active{opacity:1}
.touch-zone.left:active{background:linear-gradient(to top,rgba(0,100,255,.15),transparent)}
.touch-zone.right:active{background:linear-gradient(to top,rgba(0,100,255,.15),transparent)}
.touch-label{font-size:2.5em;color:rgba(255,255,255,.5);text-shadow:0 0 20px rgba(0,212,255,.5)}

/* Overlay */
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,18,.85);backdrop-filter:blur(12px);transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,3.5em);color:#00d4ff;text-shadow:0 0 30px rgba(0,212,255,.5);margin-bottom:8px}
#overlay .subtitle{color:#8899aa;font-size:1.1em;margin-bottom:30px;text-align:center;padding:0 20px}
#overlay .final-score{color:#ffaa00;font-size:1.5em;font-weight:700;margin-bottom:20px;display:none}
#start-btn{background:linear-gradient(135deg,#00d4ff,#0088ff);color:#0a0a18;border:none;border-radius:14px;padding:14px 48px;font-size:1.2em;font-weight:700;cursor:pointer;pointer-events:auto;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(0,212,255,.3)}
#start-btn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(0,212,255,.5)}
#start-btn:active{transform:scale(.97)}
.controls-hint{color:#556677;font-size:.85em;margin-top:20px;text-align:center;line-height:1.6}

/* Mobile adjustments */
@media(max-width:600px){
  #hud{padding:8px 12px}
  #score-box,#highscore-box{padding:6px 12px;font-size:.9em}
  .touch-label{font-size:2em}
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="score-box">🍎 <span id="score">0</span></div>
  <div id="highscore-box">🏆 <span id="highscore">0</span></div>
</div>

<div id="touch-zones">
  <div class="touch-zone left" id="touch-left"><span class="touch-label">◀</span></div>
  <div class="touch-zone right" id="touch-right"><span class="touch-label">▶</span></div>
</div>

<div id="overlay">
  <h1>🐍 Snake 3D</h1>
  <div class="subtitle">Recoge las manzanas y crece sin chocar contigo mismo</div>
  <div class="final-score" id="final-score"></div>
  <button id="start-btn">JUGAR</button>
  <div class="controls-hint">
    🖥️ Flechas ← → para girar<br>
    📱 Toca izquierda / derecha de la pantalla
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ─── CONFIG ───
const GRID_SIZE = 40;
const CELL = 1;
const MOVE_INTERVAL = 160; // ms between moves
const TURN_ANGLE = Math.PI / 2;

// ─── STATE ───
let snake = [];
let direction = 0; // radians, 0 = +X
let apple = null;
let score = 0;
let highScore = parseInt(localStorage.getItem('snake3d_highscore') || '0');
let running = false;
let lastMove = 0;
let gameOver = false;

// ─── DOM ───
const canvas = document.getElementById('game-canvas');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const finalScoreEl = document.getElementById('final-score');
const touchLeft = document.getElementById('touch-left');
const touchRight = document.getElementById('touch-right');

highscoreEl.textContent = highScore;

// ─── AUDIO ───
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type = 'square', vol = 0.12) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxEat() {
  playTone(587, 0.1, 'square', 0.1);
  setTimeout(() => playTone(784, 0.15, 'square', 0.1), 80);
}

function sfxTurn() {
  playTone(330, 0.04, 'sine', 0.04);
}

function sfxGameOver() {
  playTone(200, 0.3, 'sawtooth', 0.12);
  setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.1), 200);
}

// ─── THREE.JS SETUP ───
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, GRID_SIZE * 0.6, GRID_SIZE * 1.1);

// Isometric-ish camera
const aspect = window.innerWidth / window.innerHeight;
const frustum = 20;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect / 2, frustum * aspect / 2,
  frustum / 2, -frustum / 2,
  0.1, 200
);
camera.position.set(20, 20, 20);
camera.lookAt(0, 0, 0);

// Lights
const ambient = new THREE.AmbientLight(0x334466, 0.8);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(15, 25, 15);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.left = -GRID_SIZE / 2;
dirLight.shadow.camera.right = GRID_SIZE / 2;
dirLight.shadow.camera.top = GRID_SIZE / 2;
dirLight.shadow.camera.bottom = -GRID_SIZE / 2;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x00d4ff, 0.5, 30);
scene.add(pointLight);

// ─── FLOOR GRID ───
const half = GRID_SIZE / 2;
const floorGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x111122,
  roughness: 0.9,
  metalness: 0.1
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

// Grid lines
const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x1a1a3a, 0x151530);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// Border walls (subtle)
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a2a4a, transparent: true, opacity: 0.3, roughness: 0.8 });
const wallGeo = new THREE.BoxGeometry(GRID_SIZE, 0.6, 0.3);
const wall1 = new THREE.Mesh(wallGeo, wallMat); wall1.position.set(0, 0.3, -half); scene.add(wall1);
const wall2 = new THREE.Mesh(wallGeo, wallMat); wall2.position.set(0, 0.3, half); scene.add(wall2);
const wallGeo2 = new THREE.BoxGeometry(0.3, 0.6, GRID_SIZE);
const wall3 = new THREE.Mesh(wallGeo2, wallMat); wall3.position.set(-half, 0.3, 0); scene.add(wall3);
const wall4 = new THREE.Mesh(wallGeo2, wallMat); wall4.position.set(half, 0.3, 0); scene.add(wall4);

// ─── SNAKE MESHES ───
const snakeGroup = new THREE.Group();
scene.add(snakeGroup);

const headGeo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
const headMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00aa55, emissiveIntensity: 0.3, roughness: 0.3, metalness: 0.5 });
const bodyGeo = new THREE.BoxGeometry(0.75, 0.75, 0.75);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00cc66, emissive: 0x006633, emissiveIntensity: 0.15, roughness: 0.4, metalness: 0.3 });

let headMesh = null;
const bodyMeshes = [];

function createSnakeMeshes() {
  // Clear old
  while (snakeGroup.children.length) snakeGroup.remove(snakeGroup.children[0]);
  bodyMeshes.length = 0;

  headMesh = new THREE.Mesh(headGeo, headMat);
  headMesh.castShadow = true;
  snakeGroup.add(headMesh);

  // Pre-create body meshes (pool)
  for (let i = 0; i < 200; i++) {
    const m = new THREE.Mesh(bodyGeo, bodyMat);
    m.castShadow = true;
    m.visible = false;
    snakeGroup.add(m);
    bodyMeshes.push(m);
  }
}

function updateSnakeMeshes() {
  // Position head
  if (snake.length > 0 && headMesh) {
    headMesh.position.set(snake[0].x, 0.425, snake[0].z);
  }

  // Position body segments
  for (let i = 1; i < snake.length; i++) {
    if (i < bodyMeshes.length) {
      bodyMeshes[i].visible = true;
      bodyMeshes[i].position.set(snake[i].x, 0.375, snake[i].z);
      // Scale down slightly towards tail
      const t = i / snake.length;
      const s = 1 - t * 0.3;
      bodyMeshes[i].scale.set(s, s, s);
    }
  }
  // Hide excess
  for (let i = snake.length; i < bodyMeshes.length; i++) {
    bodyMeshes[i].visible = false;
  }
}

// ─── APPLE ───
const appleGroup = new THREE.Group();
scene.add(appleGroup);

const appleMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xff3344, emissive: 0xaa1122, emissiveIntensity: 0.4, roughness: 0.2, metalness: 0.3 })
);
appleMesh.castShadow = true;
appleGroup.add(appleMesh);

// Apple stem
const stemGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3, 6);
const stemMat = new THREE.MeshStandardMaterial({ color: 0x553311 });
const stem = new THREE.Mesh(stemGeo, stemMat);
stem.position.y = 0.35;
appleGroup.add(stem);

// Apple leaf
const leafGeo = new THREE.PlaneGeometry(0.15, 0.25);
const leafMat = new THREE.MeshStandardMaterial({ color: 0x33aa22, side: THREE.DoubleSide });
const leaf = new THREE.Mesh(leafGeo, leafMat);
leaf.position.set(0.1, 0.4, 0);
leaf.rotation.z = 0.5;
appleGroup.add(leaf);

// Apple glow
const appleGlow = new THREE.PointLight(0xff3344, 0.8, 4);
appleGroup.add(appleGlow);

let appleVisible = false;

function spawnApple() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE) - half,
      z: Math.floor(Math.random() * GRID_SIZE) - half
    };
  } while (snake.some(s => s.x === pos.x && s.z === pos.z));

  apple = pos;
  appleGroup.position.set(pos.x, 0.35, pos.z);
  appleVisible = true;
}

// ─── PARTICLES ───
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.08, 4, 4);

function emitParticles(x, z, color = 0xffaa00, count = 12) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(particleGeo, mat.clone());
    m.position.set(x, 0.5, z);
    m.userData.vel = {
      x: (Math.random() - 0.5) * 0.3,
      y: Math.random() * 0.2 + 0.1,
      z: (Math.random() - 0.5) * 0.3
    };
    m.userData.life = 1;
    scene.add(m);
    particles.push(m);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt * 2;
    p.position.x += p.userData.vel.x;
    p.position.y += p.userData.vel.y;
    p.position.z += p.userData.vel.z;
    p.userData.vel.y -= dt * 0.5;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.setScalar(p.userData.life);
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ─── GAME LOGIC ───
function initGame() {
  snake = [];
  direction = 0;
  score = 0;
  gameOver = false;
  scoreEl.textContent = '0';

  // Start in center
  const cx = 0, cz = 0;
  for (let i = 4; i >= 0; i--) {
    snake.push({ x: cx - i, z: cz });
  }

  createSnakeMeshes();
  spawnApple();
  updateSnakeMeshes();
}

function turnLeft() {
  if (!running || gameOver) return;
  direction -= TURN_ANGLE;
  sfxTurn();
}

function turnRight() {
  if (!running || gameOver) return;
  direction += TURN_ANGLE;
  sfxTurn();
}

function moveSnake() {
  const head = snake[0];
  const newX = head.x + Math.round(Math.cos(direction));
  const newZ = head.z + Math.round(Math.sin(direction));

  // Wall collision
  if (newX < -half || newX >= half || newZ < -half || newZ >= half) {
    endGame();
    return;
  }

  // Self collision
  if (snake.some(s => s.x === newX && s.z === newZ)) {
    endGame();
    return;
  }

  snake.unshift({ x: newX, z: newZ });

  // Apple collision
  if (apple && newX === apple.x && newZ === apple.z) {
    score++;
    scoreEl.textContent = score;
    sfxEat();
    emitParticles(apple.x, apple.z, 0xff6644, 15);
    spawnApple();
  } else {
    snake.pop();
  }

  updateSnakeMeshes();
}

function endGame() {
  gameOver = true;
  running = false;
  sfxGameOver();
  emitParticles(snake[0].x, snake[0].z, 0xff0000, 20);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snake3d_highscore', highScore);
    highscoreEl.textContent = highScore;
  }

  finalScoreEl.textContent = `Puntuación: ${score} 🍎`;
  finalScoreEl.style.display = 'block';
  startBtn.textContent = 'REINTENTAR';
  overlay.classList.remove('hidden');
}

// ─── CAMERA FOLLOW ───
function updateCamera() {
  if (snake.length === 0) return;
  const head = snake[0];
  const targetX = head.x + Math.cos(direction) * 3;
  const targetZ = head.z + Math.sin(direction) * 3;

  camera.position.x += (targetX + 20 - camera.position.x) * 0.05;
  camera.position.z += (targetZ + 20 - camera.position.z) * 0.05;
  camera.lookAt(camera.position.x - 20, 0, camera.position.z - 20);

  // Point light follows head
  pointLight.position.set(head.x, 5, head.z);
}

// ─── ANIMATION LOOP ───
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime * 1000;

  if (running && !gameOver) {
    const now = performance.now();
    if (now - lastMove >= MOVE_INTERVAL) {
      moveSnake();
      lastMove = now;
    }
  }

  // Apple animation
  if (appleVisible) {
    appleGroup.position.y = 0.35 + Math.sin(elapsed * 0.004) * 0.15;
    appleGroup.rotation.y = elapsed * 0.002;
    appleGlow.intensity = 0.6 + Math.sin(elapsed * 0.006) * 0.3;
  }

  // Particles
  updateParticles(dt);

  // Camera
  updateCamera();

  renderer.render(scene, camera);
}

// ─── RESIZE ───
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const a = w / h;
  camera.left = -frustum * a / 2;
  camera.right = frustum * a / 2;
  camera.top = frustum / 2;
  camera.bottom = -frustum / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

// ─── CONTROLS ───
// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); turnLeft(); }
  if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); turnRight(); }
});

// Touch
touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); turnLeft(); }, { passive: false });
touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); turnRight(); }, { passive: false });

// Also handle full-screen touch (top half too)
canvas.addEventListener('touchstart', (e) => {
  for (const touch of e.changedTouches) {
    if (touch.clientX < window.innerWidth / 2) {
      turnLeft();
    } else {
      turnRight();
    }
  }
}, { passive: true });

// ─── START ───
startBtn.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  overlay.classList.add('hidden');
  initGame();
  running = true;
  clock.getDelta(); // consume any accumulated delta
  lastMove = performance.now();
});

// ─── INIT ───
createSnakeMeshes();
animate();
</script>

<!-- Cocobot Stats tracking -->
<script>
(function(){
  var w='https://cocobot-stats.rgarciademarina.workers.dev';
  var p='/pages/snake3d';
  var el=document.getElementById('visit-counter');
  fetch(w+'/t?path='+encodeURIComponent(p),{method:'GET'}).catch(function(){});
  fetch(w+'/c?path='+encodeURIComponent(p))
    .then(function(r){return r.json();})
    .then(function(d){
      if(el&&d.count){el.textContent='👁️ '+d.count+' visitas';}
    })
    .catch(function(){});
})();
</script>

</body>
</html>
