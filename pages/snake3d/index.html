<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake 3D — Cocobot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game-canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0;z-index:1}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;pointer-events:none}
#score-box{background:rgba(10,10,18,.8);backdrop-filter:blur(8px);border:1px solid rgba(0,212,255,.25);border-radius:12px;padding:8px 18px;color:#00d4ff;font-size:1.1em;font-weight:700}
#highscore-box{background:rgba(10,10,18,.8);backdrop-filter:blur(8px);border:1px solid rgba(255,170,0,.25);border-radius:12px;padding:8px 18px;color:#ffaa00;font-size:.95em;font-weight:600}
#touch-overlay{position:fixed;inset:0;z-index:5;display:flex}
.touch-zone{flex:1}.touch-zone:active::after{content:'';position:absolute;inset:0;background:rgba(0,100,255,.08)}
.touch-hint{position:fixed;bottom:20%;z-index:6;font-size:3em;color:rgba(255,255,255,.15);pointer-events:none}
.touch-hint.left{left:15%}.touch-hint.right{right:15%}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,18,.9)}
#overlay.hidden{display:none !important}
#overlay h1{font-size:clamp(2em,8vw,3.5em);color:#00d4ff;text-shadow:0 0 30px rgba(0,212,255,.5);margin-bottom:8px}
#overlay .subtitle{color:#8899aa;font-size:1em;margin-bottom:25px;text-align:center;padding:0 20px}
#overlay .final-score{color:#ffaa00;font-size:1.4em;font-weight:700;margin-bottom:15px;display:none}
#start-btn{background:linear-gradient(135deg,#00d4ff,#0088ff);color:#0a0a18;border:none;border-radius:14px;padding:14px 48px;font-size:1.1em;font-weight:700;cursor:pointer;pointer-events:auto;transition:transform .15s;box-shadow:0 4px 20px rgba(0,212,255,.3)}
#start-btn:active{transform:scale(.95)}
.controls-hint{color:#556677;font-size:.8em;margin-top:18px;text-align:center;line-height:1.6}
#debug{position:fixed;top:50px;left:10px;z-index:25;color:#0a0;font-family:monospace;font-size:9px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:4px;max-height:20vh;overflow:hidden;pointer-events:none;white-space:pre-wrap;line-height:1.2;max-width:240px;opacity:.5;transition:opacity .2s}
#debug:hover{opacity:1}
#err-box{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:30;color:#ff4444;font-size:.85em;background:rgba(0,0,0,.9);padding:8px 16px;border-radius:8px;display:none;text-align:center;max-width:90%;border:1px solid #ff4444}
@media(max-width:600px){#hud{padding:8px 12px}#score-box,#highscore-box{padding:6px 12px;font-size:.85em}.touch-hint{font-size:2.5em}#debug{font-size:8px;max-width:220px;top:42px}}
</style>
<link rel="icon" href="data:;base64,=">
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="hud"><div id="score-box">🍎 <span id="score">0</span></div><div id="highscore-box">🏆 <span id="highscore">0</span></div></div>
<div id="touch-overlay"><div class="touch-zone" id="tz-left"></div><div class="touch-zone" id="tz-right"></div></div>
<div class="touch-hint left" id="hint-l">◀</div><div class="touch-hint right" id="hint-r">▶</div>

<div id="overlay">
  <h1>🐍 Snake 3D</h1>
  <div class="subtitle">Recoge las manzanas y crece sin chocar contigo mismo</div>
  <div class="final-score" id="final-score"></div>
  <button id="start-btn">JUGAR</button>
  <div class="controls-hint">
    🖥️ Flechas ← → &nbsp;o&nbsp; A / D para girar<br>
    📱 Toca mitad izquierda / derecha de la pantalla
  </div>
</div>

<div id="debug"></div>
<div id="err-box"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var dbg = document.getElementById('debug');
var errBox = document.getElementById('err-box');
var logs = [];
function log(msg) {
  var ts = new Date().toLocaleTimeString();
  logs.push('[' + ts + '] ' + msg);
  if(logs.length > 50) logs.shift();
  dbg.textContent = logs.join('\n');
  console.log('[Snake3D]', msg);
}
function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }

window.onerror = function(msg) {
  showErr('ERROR: ' + msg);
  log('❌ onerror: ' + msg);
  return true;
};

log('1. Script starting...');
if(typeof THREE === 'undefined') { showErr('Three.js no cargó'); log('❌ THREE undefined'); throw new Error('Three.js not loaded'); }
log('2. Three.js v' + THREE.REVISION);

// ─── CONFIG ───
var GRID_SIZE = 40;
var MOVE_INTERVAL = 200;
var TURN_ANGLE = Math.PI / 2;
var half = GRID_SIZE / 2;

// ─── STATE ───
var snake = [];
var direction = 0;
var apple = null;
var score = 0;
var highScore = parseInt(localStorage.getItem('snake3d_hs') || '0');
var running = false;
var lastMove = 0;
var gameOver = false;
var camAngle = 0;
var targetCamAngle = 0;

// ─── DOM ───
var canvas = document.getElementById('game-canvas');
var scoreEl = document.getElementById('score');
var highscoreEl = document.getElementById('highscore');
var overlay = document.getElementById('overlay');
var startBtn = document.getElementById('start-btn');
var finalScoreEl = document.getElementById('final-score');
var hintL = document.getElementById('hint-l');
var hintR = document.getElementById('hint-r');
highscoreEl.textContent = highScore;

// ─── AUDIO ───
var actx = null;
function initAudio() {
  if(!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone(f,d,t,v) {
  if(!actx) return;
  try {
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=t||'square'; o.frequency.value=f;
    g.gain.value=v||.08; g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  } catch(e){}
}
function sfxEat(){tone(587,.1,'square',.08);setTimeout(function(){tone(784,.12,'square',.08)},70);}
function sfxTurn(){tone(440,.03,'sine',.03);}
function sfxDie(){tone(180,.3,'sawtooth',.08);setTimeout(function(){tone(120,.4,'sawtooth',.06)},150);}

// ─── THREE.JS — SHARED MATERIALS ───
log('4. Creating renderer...');
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'default' });
} catch(e) { showErr('WebGL: '+e.message); log('❌ '+e.message); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
log('4. Renderer OK ' + window.innerWidth + 'x' + window.innerHeight);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 22, 45);

var aspect = window.innerWidth / window.innerHeight;
var viewSize = 16;
var camera = new THREE.OrthographicCamera(-viewSize*aspect/2, viewSize*aspect/2, viewSize/2, -viewSize/2, .1, 200);
camera.position.set(0, 16, 12);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x4466aa, .8));
var sun = new THREE.DirectionalLight(0xffffff, .9);
sun.position.set(8, 20, 8);
scene.add(sun);
var pLight = new THREE.PointLight(0x00ccff, .3, 20);
scene.add(pLight);

// Floor
var flr = new THREE.Mesh(new THREE.PlaneGeometry(GRID_SIZE+4, GRID_SIZE+4), new THREE.MeshStandardMaterial({color:0x0e0e1a, roughness:1}));
flr.rotation.x = -Math.PI/2; flr.position.y = -.05; scene.add(flr);
var gridH = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x1a1a3a, 0x141428); gridH.position.y = .01; scene.add(gridH);

// Walls — shared material
var wm = new THREE.MeshStandardMaterial({color:0x1a2a4a, transparent:true, opacity:.3});
var hw = half + .15;
var w1=new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE+.5,.4,.2),wm); w1.position.set(0,.2,-hw); scene.add(w1);
var w2=new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE+.5,.4,.2),wm); w2.position.set(0,.2,hw); scene.add(w2);
var w3=new THREE.Mesh(new THREE.BoxGeometry(.2,.4,GRID_SIZE+.5),wm); w3.position.set(-hw,.2,0); scene.add(w3);
var w4=new THREE.Mesh(new THREE.BoxGeometry(.2,.4,GRID_SIZE+.5),wm); w4.position.set(hw,.2,0); scene.add(w4);
log('5. Floor+walls OK');

// ─── SNAKE — SHARED MATERIALS (FIX for WebGL context loss) ───
var sGroup = new THREE.Group(); scene.add(sGroup);
var hGeo = new THREE.BoxGeometry(.78, .45, .78);
var hMat = new THREE.MeshStandardMaterial({color:0x00ff88, emissive:0x00aa44, emissiveIntensity:.35});
var bGeo = new THREE.BoxGeometry(.68, .4, .68);
// SINGLE shared body material — no per-segment materials!
var bMat = new THREE.MeshStandardMaterial({color:0x00cc66, emissive:0x004422, emissiveIntensity:.15});
var headM = null;
var bodyMs = [];

function buildSnake() {
  while(sGroup.children.length) { var c=sGroup.children[0]; sGroup.remove(c); }
  bodyMs = [];
  headM = new THREE.Mesh(hGeo, hMat); headM.position.y = .225; sGroup.add(headM);
  // All body segments share the SAME material
  for(var i = 0; i < 200; i++) {
    var m = new THREE.Mesh(bGeo, bMat);
    m.position.y = .2; m.visible = false; sGroup.add(m); bodyMs.push(m);
  }
  log('Snake: 1 head + 200 body (1 shared material)');
}

function refreshSnake() {
  if(!snake.length) return;
  headM.position.set(snake[0].x, .225, snake[0].z);
  headM.rotation.y = -direction;
  for(var i = 1; i < snake.length; i++) {
    if(i < bodyMs.length) {
      bodyMs[i].visible = true;
      bodyMs[i].position.set(snake[i].x, .2, snake[i].z);
      var t = i / Math.max(snake.length, 1);
      var s = 1 - t * .4;
      bodyMs[i].scale.set(s, 1, s);
    }
  }
  for(var i = snake.length; i < bodyMs.length; i++) bodyMs[i].visible = false;
}

// ─── APPLE ───
var aGroup = new THREE.Group(); scene.add(aGroup);
var appleM = new THREE.Mesh(new THREE.SphereGeometry(.28, 10, 10), new THREE.MeshStandardMaterial({color:0xff2233, emissive:0x881122, emissiveIntensity:.5}));
aGroup.add(appleM);
var aGlow = new THREE.PointLight(0xff3344, .5, 3); aGroup.add(aGlow);

function spawnApple() {
  var p;
  do { p = {x:Math.floor(Math.random()*GRID_SIZE)-half, z:Math.floor(Math.random()*GRID_SIZE)-half}; }
  while(snake.some(function(s){return s.x===p.x&&s.z===p.z;}));
  apple = p; aGroup.position.set(p.x, .28, p.z);
}

// ─── PARTICLES (shared material) ───
var parts = [];
var partMat = new THREE.MeshBasicMaterial({color:0xffaa00, transparent:true});
var partGeo = new THREE.SphereGeometry(.05, 4, 4);
function burst(x, z, col, n) {
  for(var i = 0; i < (n||8); i++) {
    var m = new THREE.Mesh(partGeo, partMat.clone());
    m.position.set(x, .3, z);
    m.material.color.setHex(col); m.material.opacity = 1;
    m.userData = {vx:(Math.random()-.5)*.2, vy:Math.random()*.1+.05, vz:(Math.random()-.5)*.2, life:1};
    scene.add(m); parts.push(m);
  }
}
function tickParts(dt) {
  for(var i=parts.length-1; i>=0; i--) {
    var p=parts[i]; p.userData.life -= dt*2.5;
    p.position.x+=p.userData.vx; p.position.y+=p.userData.vy; p.position.z+=p.userData.vz;
    p.userData.vy -= dt*.3;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.setScalar(Math.max(.01, p.userData.life));
    if(p.userData.life<=0) { scene.remove(p); p.material.dispose(); parts.splice(i,1); }
  }
}

log('6. Scene ready');

// ─── GAME ───
function initGame() {
  log('initGame()');
  snake=[]; direction=0; score=0; gameOver=false;
  camAngle=0; targetCamAngle=0; scoreEl.textContent='0';
  // Head at -10, body trailing at -11, -12, -13
  snake.push({x:-10,z:0}); // head (index 0)
  snake.push({x:-11,z:0});
  snake.push({x:-12,z:0});
  snake.push({x:-13,z:0});
  buildSnake(); spawnApple(); refreshSnake();
  log('Snake: '+snake.length+' seg at ['+snake.map(function(s){return '('+s.x+','+s.z+')'}).join(' ')+'], dir=0, apple at ('+apple.x+','+apple.z+')');
}

function turnL(){if(!running||gameOver)return;direction-=TURN_ANGLE;targetCamAngle-=TURN_ANGLE;sfxTurn();}
function turnR(){if(!running||gameOver)return;direction+=TURN_ANGLE;targetCamAngle+=TURN_ANGLE;sfxTurn();}

function step() {
  if(gameOver) return;
  var h=snake[0];
  var nx=h.x+Math.round(Math.cos(direction));
  var nz=h.z+Math.round(Math.sin(direction));
  if(nx<-half||nx>=half||nz<-half||nz>=half){log('Wall hit');die();return;}
  if(snake.some(function(s){return s.x===nx&&s.z===nz;})){log('Self hit');die();return;}
  snake.unshift({x:nx,z:nz});
  if(apple&&nx===apple.x&&nz===apple.z){score++;scoreEl.textContent=score;sfxEat();burst(apple.x,apple.z,0xff6644,8);spawnApple();log('Eat! score='+score);}
  else{snake.pop();}
  refreshSnake();
}

function die() {
  log('GAME OVER score='+score);
  gameOver=true; running=false; sfxDie();
  if(snake.length) burst(snake[0].x,snake[0].z,0xff0000,10);
  if(score>highScore){highScore=score;localStorage.setItem('snake3d_hs',highScore);highscoreEl.textContent=highScore;}
  finalScoreEl.textContent='Puntuación: '+score+' 🍎';
  finalScoreEl.style.display='block';
  startBtn.textContent='REINTENTAR';
  overlay.classList.remove('hidden');
  hintL.style.opacity='1'; hintR.style.opacity='1';
}

// Camera
function updateCam() {
  if(!snake.length) return;
  var h=snake[0];
  var diff=targetCamAngle-camAngle;
  while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
  camAngle+=diff*.07;
  var dist=14;
  camera.position.x+=(h.x-Math.sin(camAngle)*dist*.3-camera.position.x)*.05;
  camera.position.z+=(h.z-Math.cos(camAngle)*dist*.3+dist*.7-camera.position.z)*.05;
  camera.position.y=dist;
  camera.lookAt(h.x+Math.cos(direction)*2, 0, h.z+Math.sin(direction)*2);
  pLight.position.set(h.x,5,h.z);
}

// ─── WebGL context loss handling ───
canvas.addEventListener('webglcontextlost', function(e) {
  e.preventDefault();
  log('⚠️ WebGL context LOST');
  showErr('WebGL perdido — recuperando...');
  running = false;
});
canvas.addEventListener('webglcontextrestored', function(e) {
  log('✅ WebGL context RESTORED');
  showErr(''); errBox.style.display='none';
  // Only rebuild if game is not running
  if(!running && !gameOver) {
    try { buildSnake(); refreshSnake(); log('Scene rebuilt (idle)'); } catch(err) { log('❌ Rebuild: '+err.message); }
  } else {
    log('Context restored during game — continuing');
    if(running) { lastMove = performance.now(); } // reset timer to avoid burst
  }
});

// ─── ANIMATION LOOP ───
var frameCount = 0;
var stepsExecuted = 0;
log('7. Starting loop...');
function loop(time) {
  requestAnimationFrame(loop);
  frameCount++;
  try {
    var dt = Math.min((time-(loop._p||time))/1000, .05);
    loop._p = time;

    if(frameCount===1) log('8. First frame OK');
    if(frameCount===60) log('9. 60 frames OK, waiting for JUGAR');

    if(running && !gameOver) {
      if(time-lastMove >= MOVE_INTERVAL) {
        stepsExecuted++;
        step();
        lastMove=time;
      }
    }

    if(apple) { aGroup.position.y=.28+Math.sin(time*.003)*.1; aGroup.rotation.y=time*.002; }
    tickParts(dt);
    updateCam();
    renderer.render(scene, camera);
  } catch(e) {
    log('❌ Loop err f'+frameCount+': '+e.message);
    showErr(e.message);
  }
}

// ─── RESIZE ───
window.addEventListener('resize', function() {
  var w=window.innerWidth,h=window.innerHeight,a=w/h;
  camera.left=-viewSize*a/2;camera.right=viewSize*a/2;
  camera.top=viewSize/2;camera.bottom=-viewSize/2;
  camera.updateProjectionMatrix(); renderer.setSize(w,h);
});

// ─── CONTROLS ───
log('10. Controls ready');
document.addEventListener('keydown', function(e) {
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();turnL();}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();turnR();}
});
document.getElementById('tz-left').addEventListener('touchstart',function(e){e.preventDefault();turnL();},{passive:false});
document.getElementById('tz-right').addEventListener('touchstart',function(e){e.preventDefault();turnR();},{passive:false});

// ─── START ───
startBtn.addEventListener('click', function() {
  log('▶ CLICK JUGAR');
  initAudio();
  overlay.classList.add('hidden');
  hintL.style.opacity='0'; hintR.style.opacity='0';
  initGame();
  running=true; lastMove=performance.now();
  log('RUNNING! lastMove='+lastMove);
});

// ─── INIT ───
buildSnake();
requestAnimationFrame(loop);
log('✅ INIT COMPLETE');
</script>
</body>
</html>
