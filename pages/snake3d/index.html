<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake 3D — Cocobot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game-canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0;z-index:1}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;pointer-events:none}
#score-box{background:rgba(10,10,18,.8);backdrop-filter:blur(8px);border:1px solid rgba(0,212,255,.25);border-radius:12px;padding:8px 18px;color:#00d4ff;font-size:1.1em;font-weight:700}
#highscore-box{background:rgba(10,10,18,.8);backdrop-filter:blur(8px);border:1px solid rgba(255,170,0,.25);border-radius:12px;padding:8px 18px;color:#ffaa00;font-size:.95em;font-weight:600}
#touch-overlay{position:fixed;inset:0;z-index:5;display:flex}
.touch-zone{flex:1}.touch-zone:active::after{content:'';position:absolute;inset:0;background:rgba(0,100,255,.08)}
.touch-hint{position:fixed;bottom:20%;z-index:6;font-size:3em;color:rgba(255,255,255,.15);pointer-events:none}
.touch-hint.left{left:15%}.touch-hint.right{right:15%}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,18,.9)}
#overlay.hidden{display:none !important}
#overlay h1{font-size:clamp(2em,8vw,3.5em);color:#00d4ff;text-shadow:0 0 30px rgba(0,212,255,.5);margin-bottom:8px}
#overlay .subtitle{color:#8899aa;font-size:1em;margin-bottom:25px;text-align:center;padding:0 20px}
#overlay .final-score{color:#ffaa00;font-size:1.4em;font-weight:700;margin-bottom:15px;display:none}
#start-btn{background:linear-gradient(135deg,#00d4ff,#0088ff);color:#0a0a18;border:none;border-radius:14px;padding:14px 48px;font-size:1.1em;font-weight:700;cursor:pointer;pointer-events:auto;transition:transform .15s;box-shadow:0 4px 20px rgba(0,212,255,.3)}
#start-btn:active{transform:scale(.95)}
.controls-hint{color:#556677;font-size:.8em;margin-top:18px;text-align:center;line-height:1.6}
#debug{position:fixed;top:50px;left:10px;z-index:25;color:#0a0;font-family:monospace;font-size:9px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:4px;max-height:25vh;overflow:hidden;pointer-events:none;white-space:pre-wrap;line-height:1.2;max-width:280px;opacity:.4;transition:opacity .2s}
#debug:hover{opacity:1}
#err-box{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:30;color:#ff4444;font-size:.85em;background:rgba(0,0,0,.9);padding:8px 16px;border-radius:8px;display:none;text-align:center;max-width:90%;border:1px solid #ff4444}
@media(max-width:600px){#hud{padding:8px 12px}#score-box,#highscore-box{padding:6px 12px;font-size:.85em}.touch-hint{font-size:2.5em}#debug{font-size:8px;max-width:200px;top:42px}}
</style>
<link rel="icon" href="data:;base64,=">
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="hud"><div id="score-box">🍎 <span id="score">0</span></div><div id="highscore-box">🏆 <span id="highscore">0</span></div></div>
<div id="touch-overlay"><div class="touch-zone" id="tz-left"></div><div class="touch-zone" id="tz-right"></div></div>
<div class="touch-hint left" id="hint-l">◀</div><div class="touch-hint right" id="hint-r">▶</div>

<div id="overlay">
  <h1>🐍 Snake 3D</h1>
  <div class="subtitle">Recoge manzanas, esquiva obstáculos y crece sin chocar</div>
  <div class="final-score" id="final-score"></div>
  <button id="start-btn">JUGAR</button>
  <div class="controls-hint">
    🖥️ Flechas ← → &nbsp;o&nbsp; A / D para girar<br>
    📱 Toca mitad izquierda / derecha de la pantalla
  </div>
</div>

<div id="debug"></div>
<div id="err-box"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var dbg = document.getElementById('debug');
var errBox = document.getElementById('err-box');
var logs = [];
function log(msg) {
  var ts = new Date().toLocaleTimeString();
  logs.push('[' + ts + '] ' + msg);
  if(logs.length > 60) logs.shift();
  dbg.textContent = logs.join('\n');
  console.log('[Snake3D]', msg);
}
function showErr(msg) { errBox.textContent = msg; errBox.style.display = msg ? 'block' : 'none'; }

window.onerror = function(msg) { showErr('ERROR: '+msg); log('❌ onerror: '+msg); return true; };

log('1. Script starting...');
if(typeof THREE === 'undefined') { showErr('Three.js no cargó'); throw new Error('Three.js not loaded'); }
log('2. Three.js v' + THREE.REVISION);

// ─── CONFIG ───
var GRID_SIZE = 30;
var MOVE_INTERVAL = 200;
var TURN_ANGLE = Math.PI / 2;
var half = GRID_SIZE / 2;
var cellOff = -half + 0.5; // offset to center grid coords in cell centers
var NUM_APPLES = 4;
var OBSTACLE_SPAWN_EVERY = 3; // spawn obstacle every N apples eaten
var OBSTACLE_MIN_DIST_SNAKE = 6;
var OBSTACLE_MIN_DIST_EACH = 3;
var OBSTACLE_MIN_DIST_APPLE = 3;
var MAX_OBSTACLES = 30;

// ─── STATE ───
var snake = [];
var direction = 0;
var apples = [];
var obstacles = [];
var score = 0;
var highScore = parseInt(localStorage.getItem('snake3d_hs') || '0');
var running = false;
var lastMove = 0;
var gameOver = false;
var camSmoothX = 0, camSmoothZ = 0; // smooth camera target
var prevSnake = []; // previous positions for interpolation
var moveElapsed = 0; // time since last move, for smooth interpolation

// ─── DOM ───
var canvas = document.getElementById('game-canvas');
var scoreEl = document.getElementById('score');
var highscoreEl = document.getElementById('highscore');
var overlay = document.getElementById('overlay');
var startBtn = document.getElementById('start-btn');
var finalScoreEl = document.getElementById('final-score');
var hintL = document.getElementById('hint-l');
var hintR = document.getElementById('hint-r');
highscoreEl.textContent = highScore;

// ─── AUDIO ───
var actx = null;
function initAudio() {
  if(!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone(f,d,t,v) {
  if(!actx) return;
  try {
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=t||'square'; o.frequency.value=f;
    g.gain.value=v||.08; g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  } catch(e){}
}
function sfxEat(){tone(587,.1,'square',.08);setTimeout(function(){tone(784,.12,'square',.08)},70);}
function sfxTurn(){tone(440,.03,'sine',.03);}
function sfxDie(){tone(180,.3,'sawtooth',.08);setTimeout(function(){tone(120,.4,'sawtooth',.06)},150);}
function sfxObstacle(){tone(220,.15,'square',.1);setTimeout(function(){tone(330,.2,'square',.08)},100);}

// ─── THREE.JS ───
log('3. Creating renderer...');
var renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'default' }); }
catch(e) { showErr('WebGL: '+e.message); log('❌ '+e.message); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
log('3. Renderer OK ' + window.innerWidth + 'x' + window.innerHeight);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 18, 38);

// PERSPECTIVE camera — third person behind snake
var aspect = window.innerWidth / window.innerHeight;
var FOV = 55;
var camera = new THREE.PerspectiveCamera(FOV, aspect, 0.1, 200);
camera.position.set(-12 + cellOff, 10, 6);
camera.lookAt(-7 + cellOff, 0, 0);

scene.add(new THREE.AmbientLight(0x4466aa, .7));
var sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(10, 25, 10);
sun.castShadow = false;
scene.add(sun);
var pLight = new THREE.PointLight(0x00ccff, .4, 25);
scene.add(pLight);

// Floor — checkerboard texture
var floorCanvas = document.createElement('canvas');
floorCanvas.width = 256; floorCanvas.height = 256;
var fctx = floorCanvas.getContext('2d');
var sq = 256 / GRID_SIZE;
for(var fy = 0; fy < GRID_SIZE; fy++) {
  for(var fx = 0; fx < GRID_SIZE; fx++) {
    fctx.fillStyle = (fx + fy) % 2 === 0 ? '#111122' : '#0c0c18';
    fctx.fillRect(fx * sq, fy * sq, sq + .5, sq + .5);
  }
}
var floorTex = new THREE.CanvasTexture(floorCanvas);
floorTex.wrapS = floorTex.wrapT = THREE.ClampToEdgeWrapping;
var flr = new THREE.Mesh(new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE), new THREE.MeshStandardMaterial({map:floorTex, roughness:.9}));
flr.rotation.x = -Math.PI/2; flr.position.y = -.02; scene.add(flr);

// Walls — right at the edge of the checkerboard
var wm = new THREE.MeshStandardMaterial({color:0x1a2a4a, transparent:true, opacity:.35});
var hw = half;
var w1=new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE+.3,.4,.15),wm); w1.position.set(0,.2,-hw); scene.add(w1);
var w2=new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE+.3,.4,.15),wm); w2.position.set(0,.2,hw); scene.add(w2);
var w3=new THREE.Mesh(new THREE.BoxGeometry(.15,.4,GRID_SIZE+.3),wm); w3.position.set(-hw,.2,0); scene.add(w3);
var w4=new THREE.Mesh(new THREE.BoxGeometry(.15,.4,GRID_SIZE+.3),wm); w4.position.set(hw,.2,0); scene.add(w4);
log('4. Floor+walls OK');

// ─── SNAKE ───
var sGroup = new THREE.Group(); scene.add(sGroup);
var hGeo = new THREE.BoxGeometry(.8, .5, .8);
var hMat = new THREE.MeshStandardMaterial({color:0x00ff88, emissive:0x00aa44, emissiveIntensity:.35});
var bGeo = new THREE.BoxGeometry(.7, .45, .7);
var bMat = new THREE.MeshStandardMaterial({color:0x00cc66, emissive:0x004422, emissiveIntensity:.15});
var headM = null;
var bodyMs = [];

function buildSnake() {
  while(sGroup.children.length) { var c=sGroup.children[0]; sGroup.remove(c); c.geometry&&c.geometry.dispose(); }
  bodyMs = [];
  headM = new THREE.Mesh(hGeo, hMat); headM.position.y = .25; sGroup.add(headM);
  for(var i = 0; i < 200; i++) {
    var m = new THREE.Mesh(bGeo, bMat);
    m.position.y = .225; m.visible = false; sGroup.add(m); bodyMs.push(m);
  }
}

function refreshSnake() {
  if(!snake.length) return;

  // Interpolation progress: 0 = prev, 1 = current
  var t = Math.min(moveElapsed / MOVE_INTERVAL, 1);

  // Lerp head
  var hx = snake[0].x + cellOff;
  var hz = snake[0].z + cellOff;
  if(prevSnake.length && t < 1) {
    hx = (prevSnake[0].x + (snake[0].x - prevSnake[0].x) * t) + cellOff;
    hz = (prevSnake[0].z + (snake[0].z - prevSnake[0].z) * t) + cellOff;
  }
  headM.position.set(hx, .25, hz);
  headM.rotation.y = -direction;

  // Lerp body
  for(var i = 1; i < snake.length; i++) {
    if(i < bodyMs.length) {
      bodyMs[i].visible = true;
      var bx = snake[i].x + cellOff;
      var bz = snake[i].z + cellOff;
      if(prevSnake[i] && t < 1) {
        bx = (prevSnake[i].x + (snake[i].x - prevSnake[i].x) * t) + cellOff;
        bz = (prevSnake[i].z + (snake[i].z - prevSnake[i].z) * t) + cellOff;
      }
      bodyMs[i].position.set(bx, .225, bz);
      var frac = i / Math.max(snake.length, 1);
      var s = 1 - frac * .4;
      bodyMs[i].scale.set(s, 1, s);
    }
  }
  for(var i = snake.length; i < bodyMs.length; i++) bodyMs[i].visible = false;
}

// ─── APPLES ───
var appleGroup = new THREE.Group(); scene.add(appleGroup);
var appleMeshes = [];
var appleGeo = new THREE.SphereGeometry(.25, 10, 10);
var appleMat = new THREE.MeshStandardMaterial({color:0xff2233, emissive:0x881122, emissiveIntensity:.5});

function buildApples() {
  while(appleGroup.children.length) { var c=appleGroup.children[0]; appleGroup.remove(c); }
  appleMeshes = [];
  for(var i = 0; i < NUM_APPLES; i++) {
    var g = new THREE.Group();
    var m = new THREE.Mesh(appleGeo, appleMat);
    g.add(m);
    var gl = new THREE.PointLight(0xff3344, .3, 3); g.add(gl);
    appleGroup.add(g);
    appleMeshes.push(g);
    g.visible = false;
  }
}

function isOccupied(x, z) {
  if(snake.some(function(s){return s.x===x&&s.z===z;})) return true;
  if(apples.some(function(a){return a&&a.x===x&&a.z===z;})) return true;
  if(obstacles.some(function(o){return o.x===x&&o.z===z;})) return true;
  return false;
}

function spawnOneApple() {
  for(var tries = 0; tries < 200; tries++) {
    var x = Math.floor(Math.random()*GRID_SIZE)-half;
    var z = Math.floor(Math.random()*GRID_SIZE)-half;
    if(!isOccupied(x,z)) return {x:x, z:z};
  }
  return null;
}

function refreshApples() {
  for(var i = 0; i < NUM_APPLES; i++) {
    if(i < apples.length && apples[i]) {
      appleMeshes[i].visible = true;
      appleMeshes[i].position.set(apples[i].x + cellOff, .25, apples[i].z + cellOff);
    } else {
      appleMeshes[i].visible = false;
    }
  }
}

function initApples() {
  apples = [];
  for(var i = 0; i < NUM_APPLES; i++) {
    var a = spawnOneApple();
    if(a) apples.push(a);
  }
  refreshApples();
  log('Apples: ' + apples.length + ' spawned');
}

// ─── OBSTACLES ───
var obsGroup = new THREE.Group(); scene.add(obsGroup);
var obsMeshes = [];
var obsGeo = new THREE.BoxGeometry(.8, .7, .8);
var obsMat = new THREE.MeshStandardMaterial({color:0x664444, emissive:0x331111, emissiveIntensity:.2, roughness:.6});

function buildObstacles() {
  while(obsGroup.children.length) { var c=obsGroup.children[0]; obsGroup.remove(c); }
  obsMeshes = [];
  for(var i = 0; i < MAX_OBSTACLES; i++) {
    var m = new THREE.Mesh(obsGeo, obsMat);
    m.position.y = .35; m.visible = false; obsGroup.add(m); obsMeshes.push(m);
  }
}

function refreshObstacles() {
  for(var i = 0; i < MAX_OBSTACLES; i++) {
    if(i < obstacles.length) {
      obsMeshes[i].visible = true;
      obsMeshes[i].position.set(obstacles[i].x + cellOff, .35, obstacles[i].z + cellOff);
    } else {
      obsMeshes[i].visible = false;
    }
  }
}

function isSafeForObstacle(x, z) {
  // Min distance from snake
  for(var i = 0; i < snake.length; i++) {
    var dx = snake[i].x - x, dz = snake[i].z - z;
    if(Math.abs(dx) + Math.abs(dz) < OBSTACLE_MIN_DIST_SNAKE) return false;
  }
  // Min distance from other obstacles
  for(var i = 0; i < obstacles.length; i++) {
    var dx = obstacles[i].x - x, dz = obstacles[i].z - z;
    if(Math.abs(dx) + Math.abs(dz) < OBSTACLE_MIN_DIST_EACH) return false;
  }
  // Min distance from apples
  for(var i = 0; i < apples.length; i++) {
    if(!apples[i]) continue;
    var dx = apples[i].x - x, dz = apples[i].z - z;
    if(Math.abs(dx) + Math.abs(dz) < OBSTACLE_MIN_DIST_APPLE) return false;
  }
  // Not on snake/apple/obstacle
  if(isOccupied(x, z)) return false;
  // Within grid
  if(x < -half+1 || x >= half-1 || z < -half+1 || z >= half-1) return false;
  return true;
}

function spawnObstacle() {
  if(obstacles.length >= MAX_OBSTACLES) return;
  for(var tries = 0; tries < 300; tries++) {
    var x = Math.floor(Math.random()*GRID_SIZE)-half;
    var z = Math.floor(Math.random()*GRID_SIZE)-half;
    if(isSafeForObstacle(x, z)) {
      obstacles.push({x:x, z:z});
      refreshObstacles();
      log('Obstacle spawned at ('+x+','+z+') — total: '+obstacles.length);
      sfxObstacle();
      return;
    }
  }
  log('⚠️ Could not place obstacle (no safe spot)');
}

// ─── PARTICLES ───
var parts = [];
var partMat = new THREE.MeshBasicMaterial({color:0xffaa00, transparent:true});
var partGeo = new THREE.SphereGeometry(.05, 4, 4);
function burst(x, z, col, n) {
  for(var i = 0; i < (n||8); i++) {
    var m = new THREE.Mesh(partGeo, partMat.clone());
    m.position.set(x + cellOff, .3, z + cellOff);
    m.material.color.setHex(col); m.material.opacity = 1;
    m.userData = {vx:(Math.random()-.5)*.2, vy:Math.random()*.1+.05, vz:(Math.random()-.5)*.2, life:1};
    scene.add(m); parts.push(m);
  }
}
function tickParts(dt) {
  for(var i=parts.length-1; i>=0; i--) {
    var p=parts[i]; p.userData.life -= dt*2.5;
    p.position.x+=p.userData.vx; p.position.y+=p.userData.vy; p.position.z+=p.userData.vz;
    p.userData.vy -= dt*.3;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.setScalar(Math.max(.01, p.userData.life));
    if(p.userData.life<=0) { scene.remove(p); p.material.dispose(); parts.splice(i,1); }
  }
}

log('5. Scene ready');

// ─── GAME ───
function initGame() {
  log('initGame()');
  snake=[]; direction=0; score=0; gameOver=false;
  obstacles=[]; apples=[];
  camSmoothX = -7 + cellOff; camSmoothZ = 0 + cellOff;
  lookSmoothX = -2 + cellOff; lookSmoothZ = 0 + cellOff;
  scoreEl.textContent='0';
  // Head at -7, body trailing
  snake.push({x:-7,z:0}); snake.push({x:-8,z:0});
  snake.push({x:-9,z:0}); snake.push({x:-10,z:0});
  buildSnake(); buildObstacles(); buildApples();
  refreshObstacles();
  initApples();
  refreshSnake();
  prevSnake = snake.map(function(s){return {x:s.x, z:s.z};});
  log('Snake: '+snake.length+' seg at ['+snake.map(function(s){return '('+s.x+','+s.z+')'}).join(' ')+'], dir=0');
}

function turnL(){if(!running||gameOver)return;direction-=TURN_ANGLE;sfxTurn();log('Turn LEFT dir='+Math.round(direction/(Math.PI/2))+'/90°');}
function turnR(){if(!running||gameOver)return;direction+=TURN_ANGLE;sfxTurn();log('Turn RIGHT dir='+Math.round(direction/(Math.PI/2))+'/90°');}

function step() {
  if(gameOver) return;
  // Save previous positions for interpolation
  prevSnake = snake.map(function(s){return {x:s.x, z:s.z};});

  var h=snake[0];
  var nx=h.x+Math.round(Math.cos(direction));
  var nz=h.z+Math.round(Math.sin(direction));

  // Wall collision
  if(nx<-half||nx>=half||nz<-half||nz>=half){log('Wall hit ('+nx+','+nz+')');die();return;}
  // Self collision
  if(snake.some(function(s){return s.x===nx&&s.z===nz;})){log('Self hit ('+nx+','+nz+') snake=['+snake.map(function(s){return '('+s.x+','+s.z+')'}).join(' ')+']');die();return;}
  // Obstacle collision
  if(obstacles.some(function(o){return o.x===nx&&o.z===nz;})){log('Obstacle hit ('+nx+','+nz+')');die();return;}

  snake.unshift({x:nx,z:nz});

  // Apple collision
  var ate = false;
  for(var i = 0; i < apples.length; i++) {
    if(apples[i] && nx===apples[i].x && nz===apples[i].z) {
      score++; scoreEl.textContent=score; ate=true;
      sfxEat(); burst(apples[i].x, apples[i].z, 0xff6644, 10);
      log('Eat apple at ('+apples[i].x+','+apples[i].z+') score='+score);
      // Replace eaten apple
      var newA = spawnOneApple();
      apples[i] = newA;
      // Spawn obstacle every N apples
      if(score % OBSTACLE_SPAWN_EVERY === 0) spawnObstacle();
      break;
    }
  }
  if(!ate) snake.pop();
  // When snake grows, prevSnake is one shorter — prepend head position
  if(ate && prevSnake.length < snake.length) {
    prevSnake.unshift({x:snake[0].x, z:snake[0].z});
  }
  refreshApples();
}

function die() {
  log('GAME OVER score='+score);
  gameOver=true; running=false; sfxDie();
  if(snake.length) burst(snake[0].x,snake[0].z,0xff0000,12);
  if(score>highScore){highScore=score;localStorage.setItem('snake3d_hs',highScore);highscoreEl.textContent=highScore;}
  finalScoreEl.textContent='Puntuación: '+score+' 🍎';
  finalScoreEl.style.display='block';
  startBtn.textContent='REINTENTAR';
  overlay.classList.remove('hidden');
  hintL.style.opacity='1'; hintR.style.opacity='1';
}

// ─── CAMERA: Third-person behind snake, smooth ───
var camLogTimer = 0;
var lookSmoothX = 0, lookSmoothZ = 0;
function updateCam(time) {
  if(!snake.length) return;
  var h = snake[0];

  // Target: behind and above the snake, looking ahead
  var camDist = 7;
  var camHeight = 6;
  var lookAhead = 4;

  // Direction vector
  var dx = Math.cos(direction);
  var dz = Math.sin(direction);

  // Head world position (with cell offset)
  var hwX = h.x + cellOff;
  var hwZ = h.z + cellOff;

  // Ideal camera position: behind the snake
  var idealX = hwX - dx * camDist;
  var idealZ = hwZ - dz * camDist;

  // Smooth follow (lerp position — avoids snaps)
  camSmoothX += (idealX - camSmoothX) * 0.08;
  camSmoothZ += (idealZ - camSmoothZ) * 0.08;

  camera.position.x = camSmoothX;
  camera.position.y = camHeight;
  camera.position.z = camSmoothZ;

  // Smooth look-ahead point
  var targetLookX = hwX + dx * lookAhead;
  var targetLookZ = hwZ + dz * lookAhead;
  lookSmoothX += (targetLookX - lookSmoothX) * 0.08;
  lookSmoothZ += (targetLookZ - lookSmoothZ) * 0.08;
  camera.lookAt(lookSmoothX, 0, lookSmoothZ);

  // Point light follows head
  pLight.position.set(hwX, 5, hwZ);
}

// ─── WebGL context loss ───
canvas.addEventListener('webglcontextlost', function(e) {
  e.preventDefault(); log('⚠️ WebGL LOST'); showErr('WebGL perdido...'); running = false;
});
canvas.addEventListener('webglcontextrestored', function(e) {
  log('✅ WebGL RESTORED'); showErr('');
  if(!running && !gameOver) { try { buildSnake(); refreshSnake(); refreshApples(); refreshObstacles(); log('Scene rebuilt'); } catch(err) { log('❌ Rebuild: '+err.message); } }
  else if(running) { lastMove = performance.now(); log('Context restored — continuing'); }
});

// ─── ANIMATION LOOP ───
var frameCount = 0;
log('6. Starting loop...');
function loop(time) {
  requestAnimationFrame(loop);
  frameCount++;
  try {
    var dt = Math.min((time-(loop._p||time))/1000, .05);
    loop._p = time;

    if(frameCount===1) log('7. First frame OK');
    if(frameCount===60) log('8. 60 frames OK, waiting for JUGAR');

    if(running && !gameOver) {
      if(time-lastMove >= MOVE_INTERVAL) {
        moveElapsed = 0; // reset for smooth interpolation
        step();
        lastMove = time;
      }
      moveElapsed += dt * 1000; // accumulate ms since last move
      refreshSnake();
    }

    // Apple animation
    if(appleMeshes.length) {
      for(var i = 0; i < appleMeshes.length; i++) {
        if(appleMeshes[i].visible) {
          appleMeshes[i].position.y = .25 + Math.sin(time*.003 + i)*.1;
          appleMeshes[i].rotation.y = time*.002 + i;
        }
      }
    }

    tickParts(dt);
    updateCam(time);
    renderer.render(scene, camera);
  } catch(e) {
    log('❌ Loop err f'+frameCount+': '+e.message); showErr(e.message);
  }
}

// ─── RESIZE ───
window.addEventListener('resize', function() {
  var w=window.innerWidth,h=window.innerHeight,a=w/h;
  camera.aspect = a; camera.updateProjectionMatrix(); renderer.setSize(w,h);
});

// ─── CONTROLS ───
log('9. Controls ready');
document.addEventListener('keydown', function(e) {
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();turnL();}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();turnR();}
});
document.getElementById('tz-left').addEventListener('touchstart',function(e){e.preventDefault();turnL();},{passive:false});
document.getElementById('tz-right').addEventListener('touchstart',function(e){e.preventDefault();turnR();},{passive:false});

// ─── START ───
startBtn.addEventListener('click', function() {
  log('▶ CLICK JUGAR');
  initAudio();
  overlay.classList.add('hidden');
  hintL.style.opacity='0'; hintR.style.opacity='0';
  initGame();
  running=true; lastMove=performance.now();
  log('RUNNING!');
});

// ─── INIT ───
buildSnake(); buildObstacles(); buildApples();
requestAnimationFrame(loop);
log('✅ INIT COMPLETE');
</script>
