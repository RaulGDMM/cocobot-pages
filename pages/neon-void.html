<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Void - Space Survival</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; width: 100%; height: 100%; }
#ui { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; z-index: 10; }
#hud { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px; font-family: 'Courier New', monospace; }
.hud-item { color: #fff; text-shadow: 0 0 8px currentColor; font-size: 14px; }
#score-display { color: #0ff; }
#wave-display { color: #f0f; }
#hp-display { color: #f44; }
#overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,5,16,0.85); z-index: 20; pointer-events: auto; }
#overlay.hidden { display: none; }
#title { font-family: 'Courier New', monospace; font-size: clamp(32px, 8vw, 64px); color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f; margin-bottom: 8px; letter-spacing: 4px; }
#subtitle { font-family: 'Courier New', monospace; font-size: clamp(12px, 3vw, 18px); color: #888; margin-bottom: 40px; text-align: center; padding: 0 20px; }
.btn { pointer-events: auto; background: transparent; border: 2px solid #0ff; color: #0ff; font-family: 'Courier New', monospace; font-size: clamp(16px, 4vw, 24px); padding: 14px 36px; cursor: pointer; text-shadow: 0 0 10px #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.1); border-radius: 4px; transition: all 0.2s; }
.btn:hover, .btn:active { background: rgba(0,255,255,0.15); box-shadow: 0 0 30px rgba(0,255,255,0.5), inset 0 0 30px rgba(0,255,255,0.2); transform: scale(1.05); }
#final-score { font-family: 'Courier New', monospace; font-size: clamp(18px, 5vw, 32px); color: #f0f; text-shadow: 0 0 15px #f0f; margin-bottom: 30px; }
#combo-display { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-family: 'Courier New', monospace; color: #ff0; text-shadow: 0 0 10px #ff0; font-size: clamp(20px, 5vw, 36px); pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 15; }
#combo-display.show { opacity: 1; }
#highscore-msg { font-family: 'Courier New', monospace; font-size: clamp(14px, 3.5vw, 20px); color: #ff0; text-shadow: 0 0 15px #ff0; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-item" id="score-display">SCORE 0</div>
    <div class="hud-item" id="wave-display">WAVE 1</div>
    <div class="hud-item" id="hp-display">❤️❤️❤️</div>
  </div>
</div>
<div id="combo-display"></div>
<div id="overlay">
  <div id="title">NEON VOID</div>
  <div id="subtitle">Swing to move · Auto-fire on<br>Destruct all enemies to advance waves</div>
  <div id="highscore-msg">★ NEW HIGH SCORE! ★</div>
  <button class="btn" id="start-btn">START GAME</button>
</div>
<div id="final-score" style="display:none;"></div>

<script>
// ========== CANVAS SETUP ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ========== GAME STATE ==========
const state = {
  running: false,
  score: 0,
  highScore: parseInt(localStorage.getItem('neonvoid_hs') || '0'),
  wave: 1,
  hp: 3,
  combo: 0,
  comboTimer: 0,
  lastTime: 0,
  spawnTimer: 0,
  waveClearTimer: 0,
  shakeAmount: 0,
  enemies: [],
  bullets: [],
  particles: [],
  bgStars: [],
  powerups: [],
  floatingTexts: []
};

// ========== PLAYER ==========
const player = {
  x: 0, y: 0, radius: 14, speed: 280,
  angle: -Math.PI/2, fireTimer: 0, fireRate: 0.18, invincible: 0,
  trail: []
};

function resetPlayer() {
  player.x = W / 2;
  player.y = H * 0.75;
  player.trail = [];
}

// ========== INPUT ==========
const input = { active: false, startX: 0, startY: 0, curX: 0, curY: 0 };

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  input.active = true;
  input.startX = t.clientX;
  input.startY = t.clientY;
  input.curX = t.clientX;
  input.curY = t.clientY;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!input.active) return;
  const t = e.touches[0];
  input.curX = t.clientX;
  input.curY = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', () => { input.active = false; }, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  input.active = true;
  input.startX = e.clientX;
  input.startY = e.clientY;
  input.curX = e.clientX;
  input.curY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
  if (!input.active) return;
  input.curX = e.clientX;
  input.curY = e.clientY;
});

canvas.addEventListener('mouseup', () => { input.active = false; });

// ========== ENTITIES ==========
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const types = ['chaser', 'drifter', 'shooter'];
  const waveThresholds = [1, 3, 5];
  let type = 'chaser';
  if (state.wave >= 3 && Math.random() < 0.4) type = 'drifter';
  if (state.wave >= 5 && Math.random() < 0.3) type = 'shooter';

  const hp = type === 'shooter' ? 2 : 1;
  const baseSpeed = 80 + state.wave * 8;
  const speed = type === 'drifter' ? baseSpeed * 0.6 : baseSpeed;

  const angle = Math.atan2(player.y - y, player.x - x);

  state.enemies.push({
    x, y, radius: type === 'chaser' ? 12 : 16, speed, angle, type, hp, maxHp: hp,
    color: type === 'chaser' ? '#f44' : type === 'drifter' ? '#ff0' : '#f80',
    shootTimer: 3 + Math.random() * 2, pulseTimer: 0
  });
}

function spawnBullet(x, y, angle, speed, isEnemy) {
  state.bullets.push({
    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    radius: 3, life: 2.5, isEnemy, trail: []
  });
}

function spawnParticle(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 200;
    state.particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      radius: 1.5 + Math.random() * 3, life: 0.4 + Math.random() * 0.6,
      maxLife: 0.4 + Math.random() * 0.6, color
    });
  }
}

function spawnFloatingText(x, y, text, color) {
  state.floatingTexts.push({ x, y, text, color, life: 1.2, maxLife: 1.2 });
}

// ========== BACKGROUND STARS ==========
function initStars() {
  state.bgStars = [];
  for (let i = 0; i < 120; i++) {
    state.bgStars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: 0.5 + Math.random() * 1.5, speed: 5 + Math.random() * 15,
      brightness: 0.3 + Math.random() * 0.7
    });
  }
}

// ========== GAME LOGIC ==========
function update(dt) {
  // Player movement (swing/lerp toward touch point)
  if (input.active) {
    const dx = input.curX - player.x;
    const dy = input.curY - player.y;
    const targetX = Math.max(player.radius, Math.min(W - player.radius, player.x + dx * dt * 4));
    const targetY = Math.max(player.radius, Math.min(H - player.radius, player.y + dy * dt * 4));
    player.x = targetX;
    player.y = targetY;
  }

  // Player trail
  player.trail.push({ x: player.x, y: player.y });
  if (player.trail.length > 12) player.trail.shift();

  // Auto-fire
  player.fireTimer -= dt;
  if (player.fireTimer <= 0 && state.enemies.length > 0) {
    player.fireTimer = player.fireRate;
    const target = findNearestEnemy();
    if (target) {
      const angle = Math.atan2(target.y - player.y, target.x - player.x);
      spawnBullet(player.x, player.y - 10, angle, 500, false);
      // Side shots at higher waves
      if (state.wave >= 3) {
        const spread = 0.15;
        spawnBullet(player.x - 12, player.y, angle - spread, 480, false);
        spawnBullet(player.x + 12, player.y, angle + spread, 480, false);
      }
    } else {
      spawnBullet(player.x, player.y - 10, -Math.PI/2, 500, false);
    }
  }

  // Invincibility timer
  if (player.invincible > 0) player.invincible -= dt;

  // Spawn enemies
  const maxEnemies = 5 + state.wave * 2;
  if (state.enemies.length < maxEnemies) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      state.spawnTimer = Math.max(0.3, 1.5 - state.wave * 0.08);
    }
  }

  // Wave management
  if (state.enemies.length === 0 && state.waveClearTimer <= 0) {
    state.wave++;
    document.getElementById('wave-display').textContent = `WAVE ${state.wave}`;
    spawnFloatingText(W/2, H/2, `WAVE ${state.wave}`, '#f0f');
    // Heal on wave clear (every 5 waves)
    if (state.wave % 5 === 1 && state.hp < 3) {
      state.hp++;
      spawnFloatingText(W/2, H*0.3, '+1 HP', '#0f0');
    }
    updateHUD();
  }
  if (state.enemies.length === 0) state.waveClearTimer += dt;

  // Update enemies
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    e.pulseTimer += dt * 4;

    if (e.type === 'chaser') {
      const angle = Math.atan2(player.y - e.y, player.x - e.x);
      e.angle = angle;
      e.x += Math.cos(angle) * e.speed * dt;
      e.y += Math.sin(angle) * e.speed * dt;
    } else if (e.type === 'drifter') {
      // Move toward center but also orbit slightly
      const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
      e.angle = angleToPlayer + Math.sin(e.pulseTimer * 0.5) * 0.5;
      e.x += Math.cos(e.angle) * e.speed * dt;
      e.y += Math.sin(e.angle) * e.speed * dt;
    } else if (e.type === 'shooter') {
      const dist = Math.hypot(player.x - e.x, player.y - e.y);
      if (dist > 200) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed * dt;
        e.y += Math.sin(angle) * e.speed * dt;
      } else {
        // Circle strafe
        e.angle += 1.5 * dt;
        e.x += Math.cos(e.angle) * e.speed * 0.7 * dt;
        e.y += Math.sin(e.angle) * e.speed * 0.7 * dt;
      }
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        spawnBullet(e.x, e.y, angle, 250, true);
        e.shootTimer = 2.5 - state.wave * 0.05;
      }
    }

    // Enemy-player collision
    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    if (distToPlayer < player.radius + e.radius && player.invincible <= 0) {
      state.hp--;
      player.invincible = 1.5;
      state.shakeAmount = 10;
      spawnParticle(player.x, player.y, '#f44', 12);
      updateHUD();
      if (state.hp <= 0) { gameOver(); return; }
    }

    // Remove if off screen too far
    if (e.x < -100 || e.x > W+100 || e.y < -100 || e.y > H+100) {
      state.enemies.splice(i, 1);
    }
  }

  // Update bullets
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();

    // Off screen or expired
    if (b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20 || b.life <= 0) {
      state.bullets.splice(i, 1);
      continue;
    }

    // Enemy bullet hits player
    if (b.isEnemy && Math.hypot(player.x - b.x, player.y - b.y) < player.radius + b.radius && player.invincible <= 0) {
      state.hp--;
      player.invincible = 1.5;
      state.shakeAmount = 8;
      spawnParticle(player.x, player.y, '#f44', 10);
      state.bullets.splice(i, 1);
      updateHUD();
      if (state.hp <= 0) { gameOver(); return; }
    }

    // Player bullet hits enemy
    if (!b.isEnemy) {
      for (let j = state.enemies.length - 1; j >= 0; j--) {
        const e = state.enemies[j];
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
          e.hp--;
          state.bullets.splice(i, 1);
          spawnParticle(b.x, b.y, e.color, 4);
          if (e.hp <= 0) {
            killEnemy(j);
          }
          break;
        }
      }
    }
  }

  // Update particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  // Update floating texts
  for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
    const ft = state.floatingTexts[i];
    ft.y -= 40 * dt;
    ft.life -= dt;
    if (ft.life <= 0) state.floatingTexts.splice(i, 1);
  }

  // Combo timer
  if (state.combo > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) {
      state.combo = 0;
      document.getElementById('combo-display').classList.remove('show');
    }
  }

  // Background stars
  for (const s of state.bgStars) {
    s.y += s.speed * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  // Shake decay
  if (state.shakeAmount > 0) state.shakeAmount *= 0.9;
  if (state.shakeAmount < 0.5) state.shakeAmount = 0;
}

function findNearestEnemy() {
  let nearest = null, minDist = Infinity;
  for (const e of state.enemies) {
    const d = Math.hypot(player.x - e.x, player.y - e.y);
    if (d < minDist) { minDist = d; nearest = e; }
  }
  return nearest;
}

function killEnemy(index) {
  const e = state.enemies[index];
  state.enemies.splice(index, 1);
  spawnParticle(e.x, e.y, e.color, 12);

  // Combo system
  state.combo++;
  state.comboTimer = 2;
  let points = 10 * state.combo;
  if (e.type === 'drifter') points *= 2;
  if (e.type === 'shooter') points *= 3;

  state.score += points;
  document.getElementById('score-display').textContent = `SCORE ${state.score}`;

  // Show combo
  const comboEl = document.getElementById('combo-display');
  if (state.combo >= 3) {
    comboEl.textContent = `${state.combo}x COMBO! +${points}`;
    comboEl.classList.add('show');
  } else {
    spawnFloatingText(e.x, e.y, `+${points}`, e.color);
    if (state.combo >= 2) comboEl.classList.remove('show');
  }

  state.shakeAmount = Math.min(4, points / 15);
}

function gameOver() {
  state.running = false;
  spawnParticle(player.x, player.y, '#0ff', 30);
  spawnParticle(player.x, player.y, '#fff', 20);

  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const finalScoreEl = document.getElementById('final-score');

  let isNewHigh = false;
  if (state.score > state.highScore) {
    state.highScore = state.score;
    localStorage.setItem('neonvoid_hs', state.highScore);
    isNewHigh = true;
  }

  overlay.classList.remove('hidden');
  document.getElementById('title').textContent = 'GAME OVER';
  document.getElementById('subtitle').innerHTML = `Swing to move · Auto-fire on<br>Destruct all enemies to advance waves`;
  finalScoreEl.style.display = 'block';
  finalScoreEl.textContent = `SCORE: ${state.score}`;
  const hsMsg = document.getElementById('highscore-msg');
  hsMsg.style.display = isNewHigh ? 'block' : 'none';
  startBtn.textContent = 'PLAY AGAIN';

  overlay.classList.remove('hidden');
}

function updateHUD() {
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < state.hp ? '❤️' : '🖤';
  document.getElementById('hp-display').textContent = hearts;
  document.getElementById('wave-display').textContent = `WAVE ${state.wave}`;
  document.getElementById('score-display').textContent = `SCORE ${state.score}`;
}

// ========== RENDERING ==========
function render() {
  ctx.save();

  // Screen shake
  if (state.shakeAmount > 0) {
    const sx = (Math.random() - 0.5) * state.shakeAmount;
    const sy = (Math.random() - 0.5) * state.shakeAmount;
    ctx.translate(sx, sy);
  }

  // Clear
  ctx.fillStyle = '#050510';
  ctx.fillRect(-10, -10, W+20, H+20);

  // Stars
  for (const s of state.bgStars) {
    ctx.globalAlpha = s.brightness * 0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player trail
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (i / player.trail.length) * 0.4;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.radius * (i/player.trail.length), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  if (!state.running || player.invincible <= 0 || Math.floor(player.invincible * 10) % 2 === 0) {
    ctx.save();
    ctx.translate(player.x, player.y);
    // Glow
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, player.radius * 2.5);
    grd.addColorStop(0, 'rgba(0,255,255,0.3)');
    grd.addColorStop(1, 'rgba(0,255,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius * 2.5, 0, Math.PI*2);
    ctx.fill();

    // Ship shape (triangle pointing toward nearest enemy)
    const angle = state.enemies.length > 0 ? Math.atan2(findNearestEnemy().y - player.y, findNearestEnemy().x - player.x) : -Math.PI/2;
    ctx.rotate(angle);
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(player.radius + 4, 0);
    ctx.lineTo(-player.radius, -player.radius * 0.7);
    ctx.lineTo(-player.radius * 0.5, 0);
    ctx.lineTo(-player.radius, player.radius * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Enemies
  for (const e of state.enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const pulse = 1 + Math.sin(e.pulseTimer) * 0.15;

    // Glow
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 20;

    if (e.type === 'chaser') {
      ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
      ctx.fillStyle = e.color;
      // Diamond
      const r = e.radius * pulse;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(0, -r*0.7); ctx.lineTo(-r, 0); ctx.lineTo(0, r*0.7);
      ctx.closePath(); ctx.fill();
    } else if (e.type === 'drifter') {
      ctx.fillStyle = e.color;
      const r = e.radius * pulse;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI/6;
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
    } else if (e.type === 'shooter') {
      ctx.rotate(e.pulseTimer * 0.5);
      ctx.fillStyle = e.color;
      const r = e.radius * pulse;
      // Pentagon with inner ring
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (Math.PI * 2 / 5) * i - Math.PI/2;
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
      // HP indicator
      if (e.hp > 1) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, -r-8, 4, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Bullets
  for (const b of state.bullets) {
    const color = b.isEnemy ? '#f44' : '#0ff';
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;

    // Trail
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      ctx.globalAlpha = (i / b.trail.length) * 0.5;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.radius * (i/b.trail.length), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bullet head
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Particles
  for (const p of state.particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts
  for (const ft of state.floatingTexts) {
    const alpha = ft.life / ft.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ft.color;
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 8;
    ctx.font = `bold ${16 + (1-alpha)*8}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ========== GAME LOOP ==========
function gameLoop(timestamp) {
  if (!state.lastTime) state.lastTime = timestamp;
  const dt = Math.min((timestamp - state.lastTime) / 1000, 0.05); // cap at 50ms
  state.lastTime = timestamp;

  if (state.running) {
    update(dt);
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ========== START ==========
document.getElementById('start-btn').addEventListener('click', () => {
  // Reset
  state.score = 0;
  state.wave = 1;
  state.hp = 3;
  state.combo = 0;
  state.enemies = [];
  state.bullets = [];
  state.particles = [];
  state.floatingTexts = [];
  state.shakeAmount = 0;
  state.running = true;

  resetPlayer();
  updateHUD();
  initStars();

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('final-score').style.display = 'none';
});

// Init
initStars();
resetPlayer();
requestAnimationFrame(gameLoop);
</script>
</body>
