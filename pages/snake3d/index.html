<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake 3D — Cocobot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game-canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;pointer-events:none}
#score-box{background:rgba(10,10,18,.8);backdrop-filter:blur(8px);border:1px solid rgba(0,212,255,.25);border-radius:12px;padding:8px 18px;color:#00d4ff;font-size:1.1em;font-weight:700;letter-spacing:.5px}
#highscore-box{background:rgba(10,10,18,.8);backdrop-filter:blur(8px);border:1px solid rgba(255,170,0,.25);border-radius:12px;padding:8px 18px;color:#ffaa00;font-size:.95em;font-weight:600}

/* Touch zones */
#touch-zones{position:fixed;bottom:0;left:0;right:0;height:45%;z-index:5;display:flex}
.touch-zone{flex:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.touch-zone:active{opacity:1}
.touch-zone.left:active{background:linear-gradient(to top,rgba(0,100,255,.12),transparent)}
.touch-zone.right:active{background:linear-gradient(to top,rgba(0,100,255,.12),transparent)}
.touch-label{font-size:2.5em;color:rgba(255,255,255,.4)}

/* Overlay */
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,18,.88);backdrop-filter:blur(12px);transition:opacity .35s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,3.5em);color:#00d4ff;text-shadow:0 0 30px rgba(0,212,255,.5);margin-bottom:8px}
#overlay .subtitle{color:#8899aa;font-size:1.1em;margin-bottom:30px;text-align:center;padding:0 20px}
#overlay .final-score{color:#ffaa00;font-size:1.5em;font-weight:700;margin-bottom:20px;display:none}
#start-btn{background:linear-gradient(135deg,#00d4ff,#0088ff);color:#0a0a18;border:none;border-radius:14px;padding:14px 48px;font-size:1.2em;font-weight:700;cursor:pointer;pointer-events:auto;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(0,212,255,.3)}
#start-btn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(0,212,255,.5)}
#start-btn:active{transform:scale(.97)}
.controls-hint{color:#556677;font-size:.85em;margin-top:20px;text-align:center;line-height:1.6}

@media(max-width:600px){
  #hud{padding:8px 12px}
  #score-box,#highscore-box{padding:6px 12px;font-size:.9em}
  .touch-label{font-size:2em}
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="score-box">🍎 <span id="score">0</span></div>
  <div id="highscore-box">🏆 <span id="highscore">0</span></div>
</div>

<div id="touch-zones">
  <div class="touch-zone left" id="touch-left"><span class="touch-label">◀</span></div>
  <div class="touch-zone right" id="touch-right"><span class="touch-label">▶</span></div>
</div>

<div id="overlay">
  <h1>🐍 Snake 3D</h1>
  <div class="subtitle">Recoge las manzanas y crece sin chocar contigo mismo</div>
  <div class="final-score" id="final-score"></div>
  <button id="start-btn">JUGAR</button>
  <div class="controls-hint">
    🖥️ Flechas ← → para girar<br>
    📱 Toca izquierda / derecha de la pantalla
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── CONFIG ───
const GRID_SIZE = 40;
const MOVE_INTERVAL = 180;
const TURN_ANGLE = Math.PI / 2;
const half = GRID_SIZE / 2;

// ─── STATE ───
let snake = [];
let direction = 0;
let apple = null;
let score = 0;
let highScore = parseInt(localStorage.getItem('snake3d_highscore') || '0');
let running = false;
let lastMove = 0;
let gameOver = false;
let cameraAngle = 0;
let targetCameraAngle = 0;

// ─── DOM ───
const canvas = document.getElementById('game-canvas');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const finalScoreEl = document.getElementById('final-score');
const touchLeft = document.getElementById('touch-left');
const touchRight = document.getElementById('touch-right');
highscoreEl.textContent = highScore;

// ─── AUDIO ───
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function sfxEat() { playTone(587, 0.1, 'square', 0.1); setTimeout(() => playTone(784, 0.15, 'square', 0.1), 80); }
function sfxTurn() { playTone(330, 0.04, 'sine', 0.04); }
function sfxGameOver() { playTone(200, 0.3, 'sawtooth', 0.1); setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.08), 200); }

// ─── THREE.JS ───
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 25, 50);

// Top-down camera with rotation
const aspect = window.innerWidth / window.innerHeight;
const viewSize = 18;
const camera = new THREE.OrthographicCamera(
  -viewSize * aspect / 2, viewSize * aspect / 2,
  viewSize / 2, -viewSize / 2,
  0.1, 200
);

// Lights
scene.add(new THREE.AmbientLight(0x334466, 0.9));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 15, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x00d4ff, 0.4, 25);
scene.add(pointLight);

// ─── FLOOR ───
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE),
  new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x1a1a3a, 0x151530);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// Border walls
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a2a4a, transparent: true, opacity: 0.35 });
const w1 = new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE, 0.5, 0.25), wallMat); w1.position.set(0, 0.25, -half); scene.add(w1);
const w2 = new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE, 0.5, 0.25), wallMat); w2.position.set(0, 0.25, half); scene.add(w2);
const w3 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, GRID_SIZE), wallMat); w3.position.set(-half, 0.25, 0); scene.add(w3);
const w4 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, GRID_SIZE), wallMat); w4.position.set(half, 0.25, 0); scene.add(w4);

// ─── SNAKE ───
const snakeGroup = new THREE.Group();
scene.add(snakeGroup);

const headGeo = new THREE.BoxGeometry(0.8, 0.5, 0.8);
const headMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00aa55, emissiveIntensity: 0.3 });
const bodyGeo = new THREE.BoxGeometry(0.7, 0.45, 0.7);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00cc66, emissive: 0x006633, emissiveIntensity: 0.15 });

let headMesh = null;
const bodyMeshes = [];

function createSnakeMeshes() {
  while (snakeGroup.children.length) snakeGroup.remove(snakeGroup.children[0]);
  bodyMeshes.length = 0;

  headMesh = new THREE.Mesh(headGeo, headMat);
  headMesh.castShadow = true;
  snakeGroup.add(headMesh);

  for (let i = 0; i < 300; i++) {
    const m = new THREE.Mesh(bodyGeo, bodyMat.clone());
    m.castShadow = true;
    m.visible = false;
    snakeGroup.add(m);
    bodyMeshes.push(m);
  }
}

function updateSnakeMeshes() {
  if (snake.length === 0) return;

  // Head
  headMesh.position.set(snake[0].x, 0.25, snake[0].z);
  // Rotate head to face direction
  headMesh.rotation.y = -direction + Math.PI / 2;

  // Body
  for (let i = 1; i < snake.length; i++) {
    if (i < bodyMeshes.length) {
      bodyMeshes[i].visible = true;
      bodyMeshes[i].position.set(snake[i].x, 0.225, snake[i].z);
      const t = i / snake.length;
      const s = 1 - t * 0.35;
      bodyMeshes[i].scale.set(s, 1, s);
      // Color gradient: green → teal
      const g = Math.floor(204 - t * 80);
      const b = Math.floor(102 + t * 60);
      bodyMeshes[i].material.color.setRGB(0, g / 255, b / 255);
    }
  }
  for (let i = snake.length; i < bodyMeshes.length; i++) {
    bodyMeshes[i].visible = false;
  }
}

// ─── APPLE ───
const appleGroup = new THREE.Group();
scene.add(appleGroup);

const appleMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 12, 12),
  new THREE.MeshStandardMaterial({ color: 0xff3344, emissive: 0xaa1122, emissiveIntensity: 0.4 })
);
appleMesh.castShadow = true;
appleGroup.add(appleMesh);

// Stem
const stem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.02, 0.02, 0.25, 6),
  new THREE.MeshStandardMaterial({ color: 0x553311 })
);
stem.position.y = 0.3;
appleGroup.add(stem);

// Leaf
const leaf = new THREE.Mesh(
  new THREE.PlaneGeometry(0.12, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x33aa22, side: THREE.DoubleSide })
);
leaf.position.set(0.08, 0.35, 0);
leaf.rotation.z = 0.5;
appleGroup.add(leaf);

const appleGlow = new THREE.PointLight(0xff3344, 0.6, 4);
appleGroup.add(appleGlow);

let appleVisible = false;

function spawnApple() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE) - half,
      z: Math.floor(Math.random() * GRID_SIZE) - half
    };
  } while (snake.some(s => s.x === pos.x && s.z === pos.z));

  apple = pos;
  appleGroup.position.set(pos.x, 0.3, pos.z);
  appleVisible = true;
}

// ─── PARTICLES ───
const particles = [];

function emitParticles(x, z, color, count) {
  for (let i = 0; i < (count || 12); i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 4, 4),
      new THREE.MeshBasicMaterial({ color: color || 0xffaa00, transparent: true })
    );
    m.position.set(x, 0.3, z);
    m.userData = {
      vx: (Math.random() - 0.5) * 0.25,
      vy: Math.random() * 0.15 + 0.08,
      vz: (Math.random() - 0.5) * 0.25,
      life: 1
    };
    scene.add(m);
    particles.push(m);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt * 2.5;
    p.position.x += p.userData.vx;
    p.position.y += p.userData.vy;
    p.position.z += p.userData.vz;
    p.userData.vy -= dt * 0.4;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.setScalar(Math.max(0.01, p.userData.life));
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ─── GAME LOGIC ───
function initGame() {
  snake = [];
  direction = 0;
  cameraAngle = 0;
  targetCameraAngle = 0;
  score = 0;
  gameOver = false;
  scoreEl.textContent = '0';

  const cx = 0, cz = 0;
  for (let i = 4; i >= 0; i--) {
    snake.push({ x: cx - i, z: cz });
  }

  createSnakeMeshes();
  spawnApple();
  updateSnakeMeshes();
}

function turnLeft() {
  if (!running || gameOver) return;
  direction -= TURN_ANGLE;
  targetCameraAngle -= TURN_ANGLE;
  sfxTurn();
}

function turnRight() {
  if (!running || gameOver) return;
  direction += TURN_ANGLE;
  targetCameraAngle += TURN_ANGLE;
  sfxTurn();
}

function moveSnake() {
  if (gameOver) return;

  const head = snake[0];
  const dx = Math.round(Math.cos(direction));
  const dz = Math.round(Math.sin(direction));
  const newX = head.x + dx;
  const newZ = head.z + dz;

  // Wall collision
  if (newX < -half || newX >= half || newZ < -half || newZ >= half) {
    endGame();
    return;
  }

  // Self collision
  if (snake.some(s => s.x === newX && s.z === newZ)) {
    endGame();
    return;
  }

  snake.unshift({ x: newX, z: newZ });

  if (apple && newX === apple.x && newZ === apple.z) {
    score++;
    scoreEl.textContent = score;
    sfxEat();
    emitParticles(apple.x, apple.z, 0xff6644, 15);
    spawnApple();
  } else {
    snake.pop();
  }

  updateSnakeMeshes();
}

function endGame() {
  gameOver = true;
  running = false;
  sfxGameOver();
  if (snake.length > 0) emitParticles(snake[0].x, snake[0].z, 0xff0000, 20);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snake3d_highscore', highScore);
    highscoreEl.textContent = highScore;
  }

  finalScoreEl.textContent = 'Puntuación: ' + score + ' 🍎';
  finalScoreEl.style.display = 'block';
  startBtn.textContent = 'REINTENTAR';
  overlay.classList.remove('hidden');
}

// ─── CAMERA: TOP-DOWN FOLLOWING + ROTATING ───
function updateCamera() {
  if (snake.length === 0) return;
  const head = snake[0];

  // Smooth camera rotation
  let angleDiff = targetCameraAngle - cameraAngle;
  // Normalize to -PI..PI
  while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
  while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
  cameraAngle += angleDiff * 0.08;

  // Camera offset: behind the snake in the direction it's facing
  const camDist = 12;
  const offsetX = -Math.sin(cameraAngle) * camDist;
  const offsetZ = -Math.cos(cameraAngle) * camDist;

  // Smooth position follow
  const targetCamX = head.x + offsetX;
  const targetCamZ = head.z + offsetZ;
  camera.position.x += (targetCamX - camera.position.x) * 0.06;
  camera.position.z += (targetCamZ - camera.position.z) * 0.06;
  camera.position.y = 18; // Fixed height for top-down

  // Camera looks at a point ahead of the snake
  const lookAhead = 3;
  const lookX = head.x + Math.cos(direction) * lookAhead;
  const lookZ = head.z + Math.sin(direction) * lookAhead;
  camera.lookAt(lookX, 0, lookZ);

  // Rotate the camera up vector to match snake direction
  camera.up.set(
    Math.sin(cameraAngle) * 0.3,
    0.95,
    Math.cos(cameraAngle) * 0.3
  );

  // Point light follows head
  pointLight.position.set(head.x, 6, head.z);
}

// ─── ANIMATION LOOP ───
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (running && !gameOver) {
    const now = performance.now();
    if (now - lastMove >= MOVE_INTERVAL) {
      moveSnake();
      lastMove = now;
    }
  }

  // Apple animation
  if (appleVisible) {
    const t = clock.elapsedTime;
    appleGroup.position.y = 0.3 + Math.sin(t * 3) * 0.12;
    appleGroup.rotation.y = t * 1.5;
    appleGlow.intensity = 0.5 + Math.sin(t * 4) * 0.25;
  }

  updateParticles(dt);
  updateCamera();
  renderer.render(scene, camera);
}

// ─── RESIZE ───
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const a = w / h;
  camera.left = -viewSize * a / 2;
  camera.right = viewSize * a / 2;
  camera.top = viewSize / 2;
  camera.bottom = -viewSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

// ─── CONTROLS ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); turnLeft(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); turnRight(); }
});

touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); turnLeft(); }, { passive: false });
touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); turnRight(); }, { passive: false });

canvas.addEventListener('touchstart', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.clientX < window.innerWidth / 2) turnLeft();
    else turnRight();
  }
}, { passive: true });

// ─── START ───
startBtn.addEventListener('click', () => {
  ensureAudio();
  overlay.classList.add('hidden');
  initGame();
  running = true;
  lastMove = performance.now();
});

// ─── INIT ───
try {
  createSnakeMeshes();
  animate();
} catch(e) {
  console.error('Init error:', e);
}
</script>
</body>
</html>
