<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI News — Cocobot Daily</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-sidebar: #010409;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #f0883e;
      --star: #f2cc60;
      --tag-llm: #58a6ff;
      --tag-video: #f778ba;
      --tag-image: #db61a2;
      --tag-music: #a371f7;
      --tag-agent: #3fb950;
      --tag-llama: #f0883e;
      --tag-general: #8b949e;
      --tag-comfyui: #f2cc60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .header h1 { font-size: 1.25rem; flex: 1; }
    .header h1 span { font-size: 0.85rem; color: var(--text-muted); margin-left: 0.5rem; }

    /* ── Hamburger ── */
    .hamburger {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; gap: 5px; padding: 4px;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: all 0.3s ease;
    }
    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    /* ── Sidebar (dates) ── */
    .sidebar {
      position: fixed; top: 52px; left: 0; bottom: 0;
      width: 260px; background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto; padding: 1rem;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 90;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar h2 { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 0.75rem; }
    .date-list { list-style: none; }
    .date-list li a {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.75rem; margin-bottom: 2px;
      border-radius: 6px; font-size: 0.9rem;
      color: var(--text);
      transition: background 0.15s;
    }
    .date-list li a:hover, .date-list li a.active {
      background: var(--bg-card);
      text-decoration: none;
    }
    .date-list li a.active { border-left: 3px solid var(--accent); }
    .date-list li .badge { font-size: 0.7rem; background: var(--bg); padding: 2px 6px; border-radius: 10px; color: var(--text-muted); }

    /* ── Day section nav (hamburger) ── */
    .day-nav {
      position: sticky; top: 52px; z-index: 80;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.5rem; display: flex; gap: 0.5rem;
      overflow-x: auto; white-space: nowrap;
    }
    .day-nav button {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text); padding: 0.35rem 0.85rem;
      border-radius: 20px; font-size: 0.8rem;
      cursor: pointer; transition: all 0.2s;
    }
    .day-nav button:hover, .day-nav button.active {
      background: var(--accent); border-color: var(--accent); color: #000;
    }

    /* ── Main content ── */
    .main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

    /* ── Day block ── */
    .day-block { display: none; }
    .day-block.active { display: block; }
    .day-header {
      margin-bottom: 2rem; padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .day-header h2 { font-size: 1.5rem; }
    .day-header .date-sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }

    /* ── Category section ── */
    .category-section { margin-bottom: 2.5rem; }
    .category-section h3 {
      font-size: 1.1rem; margin-bottom: 1rem;
      padding-left: 0.75rem; border-left: 3px solid var(--accent);
    }

    /* ── News card ── */
    .news-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem 1.25rem;
      margin-bottom: 1rem; transition: border-color 0.2s;
    }
    .news-card:hover { border-color: var(--accent); }
    .news-card.starred {
      border-color: var(--star);
      background: linear-gradient(135deg, var(--bg-card) 0%, #1c1a0a 100%);
    }
    .news-card .card-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .news-card h4 { flex: 1; font-size: 1rem; min-width: 0; }
    .news-card .summary { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .news-card .source { font-size: 0.8rem; color: var(--text-muted); }
    .news-card .source a { color: var(--accent); }

    /* ── Star badge ── */
    .star-badge {
      display: inline-flex; align-items: center; gap: 3px;
      background: #2a2408; border: 1px solid var(--star);
      color: var(--star); font-size: 0.7rem; font-weight: 600;
      padding: 2px 8px; border-radius: 12px;
    }

    /* ── Tags ── */
    .tag {
      display: inline-block; font-size: 0.7rem; font-weight: 600;
      padding: 2px 8px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .tag-llm { background: rgba(88,166,255,0.15); color: var(--tag-llm); }
    .tag-video { background: rgba(247,120,186,0.15); color: var(--tag-video); }
    .tag-image { background: rgba(219,97,162,0.15); color: var(--tag-image); }
    .tag-music { background: rgba(163,113,247,0.15); color: var(--tag-music); }
    .tag-agent { background: rgba(63,185,80,0.15); color: var(--tag-agent); }
    .tag-llama { background: rgba(240,136,62,0.15); color: var(--tag-llama); }
    .tag-general { background: rgba(139,148,158,0.15); color: var(--tag-general); }
    .tag-comfyui { background: rgba(242,204,96,0.15); color: var(--tag-comfyui); }

    /* ── Overlay ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 85;
    }
    .overlay.show { display: block; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 2rem; color: var(--text-muted);
      font-size: 0.8rem; border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    /* ── Responsive ── */
    @media (min-width: 768px) {
      .sidebar { transform: translateX(0); }
      .main { margin-left: 260px; }
      .overlay { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <button class="hamburger" id="menuBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <h1>🤖 AI News <span>Cocobot Daily</span></h1>
  </header>

  <!-- Sidebar -->
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <h2>📅 Fechas</h2>
    <ul class="date-list" id="dateList"></ul>
  </aside>

  <!-- Day Nav (category quick links) -->
  <nav class="day-nav" id="dayNav"></nav>

  <!-- Main -->
  <main class="main" id="mainContent">
    <div class="loading">Cargando noticias…</div>
  </main>

  <!-- Footer -->
  <div class="footer">
    🐱 Cocobot AI News — Actualizado diariamente a las 9:30 CET<br>
    <a href="https://raulgdmm.github.io/cocobot-pages/" target="_blank">← Volver al índice</a>
  </div>

<script>
const CATEGORIES = {
  'llm':       { label: '🧠 LLMs',              cls: 'tag-llm',       color: '#58a6ff' },
  'video':     { label: '🎬 Video Generation',   cls: 'tag-video',     color: '#f778ba' },
  'image':     { label: '🖼️ Image Generation',   cls: 'tag-image',     color: '#db61a2' },
  'music':     { label: '🎵 Music Generation',   cls: 'tag-music',     color: '#a371f7' },
  'agent':     { label: '🤖 Agentes & IA Tools', cls: 'tag-agent',     color: '#3fb950' },
  'llama':     { label: '⚙️ llama.cpp',          cls: 'tag-llama',     color: '#f0883e' },
  'comfyui':   { label: '🎨 ComfyUI & Modelos',  cls: 'tag-comfyui',   color: '#f2cc60' },
  'general':   { label: '🌐 General IA',         cls: 'tag-general',   color: '#8b949e' },
};

let DATA = null;

// ── Load data ──
async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    DATA = await res.json();
  } catch(e) {
    // If fetch fails, use inline data
    DATA = typeof window.__aiNewsData !== 'undefined' ? window.__aiNewsData : { days: [], versions: {} };
  }
  renderDates();
  if (DATA.days.length > 0) selectDate(DATA.days[0].date);
}

// ── Render date sidebar ──
function renderDates() {
  const list = document.getElementById('dateList');
  list.innerHTML = DATA.days.map(d =>
    `<li><a href="#" data-date="${d.date}">
      <strong>${formatDate(d.date)}</strong>
      <span class="badge">${d.news.length}</span>
    </a></li>`
  ).join('');
  list.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      selectDate(a.dataset.date);
      closeSidebar();
    });
  });
}

// ── Select date ──
function selectDate(date) {
  // Update sidebar active
  document.querySelectorAll('.date-list a').forEach(a => {
    a.classList.toggle('active', a.dataset.date === date);
  });

  const day = DATA.days.find(d => d.date === date);
  if (!day) return;

  // Render day nav
  const cats = [...new Set(day.news.map(n => n.category))];
  const nav = document.getElementById('dayNav');
  nav.innerHTML = cats.map(c => {
    const cat = CATEGORIES[c] || CATEGORIES['general'];
    return `<button data-cat="${c}" class="all-btn">${cat.label}</button>`;
  }).join('');
  // Add "All" button
  nav.insertAdjacentHTML('afterbegin', '<button class="all-btn" data-cat="__all__">📋 Todo</button>');

  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.cat;
      document.querySelectorAll('.category-section').forEach(sec => {
        if (cat === '__all__' || sec.dataset.cat === cat) {
          sec.style.display = '';
        } else {
          sec.style.display = 'none';
        }
      });
    });
  });
  nav.querySelector('[data-cat="__all__"]').classList.add('active');

  // Render content
  const main = document.getElementById('mainContent');
  const versions = DATA.versions || {};

  let html = `<div class="day-block active">`;
  html += `<div class="day-header">
    <h2>${formatDateLong(day.date)}</h2>
    <div class="date-sub">🕐 9:30 CET — ${day.news.length} noticias recopiladas</div>
    ${versions.hermes || versions.llamacpp ? `<div class="date-sub" style="margin-top:0.3rem">
      ${versions.hermes ? `🤖 Hermes Agent v${versions.hermes}` : ''}
      ${versions.llamacpp ? ` · ⚙️ llama.cpp v${versions.llamacpp}` : ''}
    </div>` : ''}
  </div>`;

  // Group by category
  const grouped = {};
  day.news.forEach(n => {
    const c = n.category || 'general';
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(n);
  });

  // Category order
  const catOrder = ['comfyui', 'llm', 'video', 'image', 'music', 'agent', 'llama', 'general'];
  catOrder.forEach(cat => {
    if (!grouped[cat]) return;
    const catInfo = CATEGORIES[cat] || CATEGORIES['general'];
    html += `<section class="category-section" data-cat="${cat}" id="sec-${cat}">`;
    html += `<h3 style="border-color:${catInfo.color}">${catInfo.label}</h3>`;
    grouped[cat].forEach(n => {
      const isStar = n.star || false;
      html += `<div class="news-card${isStar ? ' starred' : ''}">
        <div class="card-top">
          <h4>${n.title}</h4>
          <span class="tag ${catInfo.cls}">${catInfo.label.replace(/^.+\s/, '')}</span>
          ${isStar ? '<span class="star-badge">⭐ Destacado</span>' : ''}
        </div>
        <p class="summary">${n.summary}</p>
        <div class="source">${n.source ? `📎 <a href="${n.source}" target="_blank">${n.source_name || 'Fuente'}</a>` : ''}</div>
      </div>`;
    });
    html += `</section>`;
  });

  html += `</div>`;
  main.innerHTML = html;

  // Smooth scroll for day nav
  document.querySelectorAll('.day-nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      if (cat === '__all__') return;
      const sec = document.getElementById(`sec-${cat}`);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ── Helpers ──
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
}
function formatDateLong(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Hamburger ──
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
function closeSidebar() {
  sidebar.classList.remove('open');
  menuBtn.classList.remove('active');
  overlay.classList.remove('show');
}
menuBtn.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  menuBtn.classList.toggle('active');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeSidebar);

// ── Init ──
loadData();
</script>
</body>
</html>
