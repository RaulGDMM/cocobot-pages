<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake 3D — Cocobot</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:;base64,=">
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="hud"><div id="score-box">🍎 <span id="score">0</span></div><div id="highscore-box">🏆 <span id="highscore">0</span></div></div>
<div id="ai-death-msg"></div>
<div id="touch-overlay"><div class="touch-zone" id="tz-left"></div><div class="touch-zone" id="tz-right"></div></div>
<div class="touch-hint left" id="hint-l">◀</div><div class="touch-hint right" id="hint-r">▶</div>

<!-- Music Player -->
<div id="music-player">
  <button id="mp-prev" title="Anterior">⏮</button>
  <button id="mp-play" title="Reproducir">▶</button>
  <button id="mp-next" title="Siguiente">⏭</button>
  <span class="track-name" id="mp-track">—</span>
  <span class="track-num" id="mp-num"></span>
</div>

<div id="overlay">
  <h1>🐍 Snake 3D</h1>
  <div class="subtitle">Recoge manzanas, esquiva obstáculos y crece sin chocar</div>
  <div class="final-score" id="final-score"></div>
  <button id="start-btn">JUGAR</button>
  <div class="controls-hint">
    🖥️ Flechas ← → &nbsp;o&nbsp; A / D para girar<br>
    📱 Toca mitad izquierda / derecha de la pantalla
  </div>
</div>

<div id="debug"></div>
<div id="err-box"></div>
<div id="games-counter">🎮 Partidas: <span id="games-count">0</span></div>

<!-- ─── SCRIPTS (order matters — all share global scope) ─── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/snake.js"></script>
<script src="js/apples.js"></script>
<script src="js/obstacles.js"></script>
<script src="js/particles.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
